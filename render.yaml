services:
  - type: web
    name: guardrail-saas
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: guardrail-db
          property: connectionString

databases:
  - name: guardrail-db
    plan: basic-256mb
    databaseName: guardrail
    user: guardrail
